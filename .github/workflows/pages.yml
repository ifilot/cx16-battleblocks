name: Browser demo and GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65 python3 python3-numpy python3-pil
      - name: Build website
        run: make site
      - name: Verify browser distribution
        run: python3 -m unittest discover -s tests -p test_distribution.py -q
      - name: Install browser test dependencies
        run: |
          npm install --prefix build/browser-tools playwright@1.64.0
          build/browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Check browser game
        env:
          NODE_PATH: ${{ github.workspace }}/build/browser-tools/node_modules
        run: node tests/check_site.cjs
      - name: Upload browser captures on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-captures
          path: build/site-check
          if-no-files-found: ignore
      - name: Upload website
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    needs: site
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
